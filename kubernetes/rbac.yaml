apiVersion: v1
kind: Namespace
metadata:
  name: airflow-triage-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-pod-launcher
  namespace: airflow-triage-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
  namespace: airflow-triage-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-launcher
  namespace: airflow-triage-lab
subjects:
  - kind: ServiceAccount
    name: airflow-pod-launcher
    namespace: airflow-triage-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-launcher
